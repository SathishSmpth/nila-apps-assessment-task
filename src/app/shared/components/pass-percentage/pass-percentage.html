@if (passStatsDetail(); as details) {
<div>
  <mat-card class="pass-stats-card" appearance="outlined">
    <mat-card-header>
      <mat-card-subtitle>Pass Percentage</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div echarts [options]="option()" [autoResize]="true"></div>
    </mat-card-content>
  </mat-card>
</div>
}

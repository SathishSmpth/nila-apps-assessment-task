@if (assessmentScore(); as details) {
<div>
  <mat-card class="avg-ass-card" appearance="outlined">
    <mat-card-header>
      <mat-card-subtitle>Average Assessment Score</mat-card-subtitle>
    </mat-card-header>
    @if (option(); as eChartOption) {
    <mat-card-content>
      <div echarts [options]="eChartOption" [autoResize]="true"></div>
    </mat-card-content>
    }
  </mat-card>
</div>
}
